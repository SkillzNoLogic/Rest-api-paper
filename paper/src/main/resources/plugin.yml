name: RestStatsAPI
version: '${version}'
main: me.skillznologic.reststatsapi.paper.PaperRestStats
api-version: '1.20'
load: POSTWORLD
depend: [PlaceholderAPI]
description: Exposes PlaceholderAPI player stats as a JSON REST API (paper build)
commands:
  reststats:
    description: Manage RestStatsAPI
    usage: /<command> <status|reload|refresh|interval <seconds>|messages <on|off|toggle>>
    permission: reststatsapi.admin
    aliases: [rsa]
permissions:
  reststatsapi.admin:
    description: Allows using /reststats
    default: op
